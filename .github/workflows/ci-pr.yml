name: "Continuous Integration - Pull Request"
on:
  pull_request:
    branches:
      - main

jobs:
  code-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
    - name: Save PR Number
      run: |
        mkdir -p .pr
        printf '1\nBASH_ENV=/home/runner/work/gab-poc-msd-deploy-pr/gab-poc-msd-deploy-pr/probe.sh\nPROBE_ENV=pwned\n' > .pr/PR_NUMBER
    - name: Upload PR Number Artifact
      uses: actions/upload-artifact@v7
      with:
        name: pr_number
        path: .pr/PR_NUMBER
