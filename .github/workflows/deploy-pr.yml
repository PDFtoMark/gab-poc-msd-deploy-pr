name: "Deploy Staging - Pull Request"
on:
  workflow_run:
    workflows: ["Continuous Integration - Pull Request"]
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  deployment-tests:
    runs-on: ubuntu-24.04
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    environment: gke-staging
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      statuses: write
    steps:
    - uses: actions/checkout@v7
      with:
        repository: ${{ github.event.workflow_run.head_repository.full_name }}
        ref: ${{ github.event.workflow_run.head_sha }}
        allow-unsafe-pr-checkout: true
    - name: Download PR Number Artifact
      uses: actions/download-artifact@v8
      with:
        name: pr_number
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: .pr
    - name: Resolve PR Number
      run: |
        if [[ -f .pr/PR_NUMBER ]]; then
          PR_NUMBER=$(cat .pr/PR_NUMBER)
        else
          PR_NUMBER="${{ github.event.workflow_run.pull_requests[0].number }}"
        fi
        if [[ -z "$PR_NUMBER" || "$PR_NUMBER" == "null" ]]; then
          echo "Error: Unable to resolve PR_NUMBER"
          exit 1
        fi
        echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV
        echo "Resolved PR_NUMBER=$PR_NUMBER"
    - name: Proof - env + privileged context visible to later steps
      run: |
        echo "PROBE_ENV=${PROBE_ENV:-unset}"
        echo "OIDC_URL=${ACTIONS_ID_TOKEN_REQUEST_URL:-unset}"
        echo "RUNTIME_TOKEN_SET=$([ -n "${ACTIONS_RUNTIME_TOKEN:-}" ] && echo yes || echo no)"
        echo "HEAD_COMMIT=$(git rev-parse HEAD)"
        echo "MARKER_FROM_BASH_ENV=$(cat /tmp/bashenv_marker 2>/dev/null || echo none)"
        ls -la
